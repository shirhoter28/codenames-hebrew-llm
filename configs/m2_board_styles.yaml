# M2: ambiguity as a controlled variable, under SELF-PLAY.
#
# The four styles form a 0% / 50% / 80% / 100% ladder of ambiguous (dual-list)
# words per 25-word board, so any trend across them is attributable to lexical
# ambiguity rather than to sampling noise.
#
# `guesser_model: same_as_codemaster` means each model guesses its own clues.
# This removes the home-field advantage a single fixed guesser hands to the
# model sharing its family, but it conflates Codemaster skill with Guesser
# skill — a model can lose by giving a bad clue OR by misreading a good one.
# Run `m2_board_styles_fixed_guesser.yaml` alongside this as the control that
# isolates Codemaster skill; the gap between the two runs is itself a finding.
#
# Scale note: this config runs the full model x method matrix against every
# style, so it costs 4x a single-style run. A completed game averages ~20
# OpenRouter calls, so the numbers below are already ~3,200 calls. Validate the
# ladder at this scale before raising n_boards / n_trials.
models:
  - meta-llama/llama-3.3-70b-instruct
  - qwen/qwen3.5-9b
  - openai/gpt-4o-mini
  - google/gemini-2.5-flash
codemaster_prompt_methods:
  - strong_hebrew
  - translate_pipeline
guesser_model: same_as_codemaster
board_styles:
  - dual_0
  - dual_50
  - dual_80
  - dual_100
n_boards: 5
n_trials: 1
